[package]
name = "faro"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Faro: plataforma de detección y reporte de situaciones de riesgo en campus universitarios"
license = "MIT"

[dependencies]
# Interfaz gráfica: egui con backend OpenGL (glow). Muy liviano y funciona en
# Windows, macOS y Linux (X11 / Wayland) incluso en equipos modestos.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
# SQLite embebido (compilado dentro del binario: no requiere instalar nada).
rusqlite = { version = "0.32", features = ["bundled"] }
# Envío de correo por SMTP con TLS en Rust puro (sin OpenSSL del sistema).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
# Fechas en hora local.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Dependencias optimizadas incluso en modo debug: la UI se siente fluida al desarrollar.
[profile.dev.package."*"]
opt-level = 2
